name: Deploy Cloud Run (DEV)

on:
  push:
    branches: [dev]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-dev.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      REPO: ${{ vars.GCP_ARTIFACT_REPO }}
      SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
      CONTAINER_ACCOUNT: ${{ vars.GCP_CONTAINER_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Docker auth (Artifact Registry)
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push
        working-directory: backend
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/api:${GITHUB_SHA}"
          docker build -t "$IMAGE" -t "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/api:latest" .
          docker push "$IMAGE"
          docker push "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/api:latest"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Cloud Run flags
        run: |
          FLAGS="--port=8080 --allow-unauthenticated --cpu-boost"
          if [ -n "${CONTAINER_ACCOUNT}" ]; then
            FLAGS="$FLAGS --service-account=${CONTAINER_ACCOUNT}"
          fi
          if [ -n "${{ vars.GCP_CLOUD_SQL_INSTANCE }}" ]; then
            FLAGS="$FLAGS --add-cloudsql-instances=${{ vars.GCP_CLOUD_SQL_INSTANCE }}"
          fi
          echo "RUN_FLAGS=$FLAGS" >> "$GITHUB_ENV"

      - name: Deploy Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          image: ${{ env.IMAGE }}
          region: ${{ env.REGION }}
          flags: ${{ env.RUN_FLAGS }}
