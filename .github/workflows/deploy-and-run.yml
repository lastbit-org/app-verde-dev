name: Deploy Cloud Run (DEV)

on:
  push:
    branches: [run]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy-and-run.yml"
      - ".github/workflows/reusable-build-push.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  build-api:
    name: Build & push API
    uses: ./.github/workflows/reusable-build-push.yml
    secrets: inherit
    with:
      context: backend
      image_name: api

  build-web:
    name: Build & push Web
    uses: ./.github/workflows/reusable-build-push.yml
    secrets: inherit
    with:
      context: frontend
      image_name: web
      vite_base: ${{ vars.VITE_BASE != '' && vars.VITE_BASE || '/' }}
      vite_api_url: ${{ vars.VITE_API_URL }}

  deploy-api:
    name: Deploy API (Cloud Run)
    needs: build-api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      REPO: ${{ vars.GCP_ARTIFACT_REPO }}
      SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
      CONTAINER_ACCOUNT: ${{ vars.GCP_CONTAINER_ACCOUNT }}
      CLOUD_SQL_INSTANCE: ${{ vars.GCP_CLOUD_SQL_INSTANCE }}
      # Prefer explicit connection name; fall back to the Cloud SQL instance attachment id.
      CLOUD_SQL_CONNECTION_NAME: ${{ vars.CLOUD_SQL_CONNECTION_NAME || vars.GCP_CLOUD_SQL_INSTANCE }}
      DATABASE_USER: ${{ vars.DATABASE_USER }}
      DATABASE_NAME: ${{ vars.DATABASE_NAME }}
      DATABASE_SYNC: ${{ vars.DATABASE_SYNC }}
      CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
      NODE_ENV: ${{ vars.NODE_ENV }}
      COOKIE_SECURE: ${{ vars.COOKIE_SECURE }}
      ALLOW_SEED: ${{ vars.ALLOW_SEED }}
      # Secret Manager refs only (e.g. jwt-secret:latest) — never the secret value.
      SM_JWT_SECRET: ${{ vars.SM_JWT_SECRET }}
      SM_DATABASE_PASSWORD: ${{ vars.SM_DATABASE_PASSWORD }}
      IMAGE: ${{ needs.build-api.outputs.image }}
    steps:
      - name: Validate deploy vars
        run: |
          missing=0
          for name in PROJECT_ID REGION REPO SERVICE IMAGE CLOUD_SQL_CONNECTION_NAME DATABASE_USER DATABASE_NAME SM_JWT_SECRET SM_DATABASE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty (set on GitHub Environment dev)"
              missing=1
            fi
          done
          echo "Deploy target project=${PROJECT_ID} region=${REGION} service=${SERVICE}"
          echo "Cloud SQL=${CLOUD_SQL_CONNECTION_NAME}"
          exit "$missing"

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Cloud Run flags and env
        id: flags
        run: |
          FLAGS="--port=8080 --allow-unauthenticated --cpu-boost"
          if [ -n "${CONTAINER_ACCOUNT}" ]; then
            FLAGS="$FLAGS --service-account=${CONTAINER_ACCOUNT}"
          fi
          if [ -n "${CLOUD_SQL_INSTANCE}" ]; then
            FLAGS="$FLAGS --add-cloudsql-instances=${CLOUD_SQL_INSTANCE}"
          elif [ -n "${CLOUD_SQL_CONNECTION_NAME}" ]; then
            FLAGS="$FLAGS --add-cloudsql-instances=${CLOUD_SQL_CONNECTION_NAME}"
          fi
          echo "value=${FLAGS}" >> "$GITHUB_OUTPUT"

          ENV_VARS="CLOUD_SQL_CONNECTION_NAME=${CLOUD_SQL_CONNECTION_NAME}"
          ENV_VARS="${ENV_VARS},DATABASE_USER=${DATABASE_USER}"
          ENV_VARS="${ENV_VARS},DATABASE_NAME=${DATABASE_NAME}"
          ENV_VARS="${ENV_VARS},NODE_ENV=${NODE_ENV:-production}"
          ENV_VARS="${ENV_VARS},COOKIE_SECURE=${COOKIE_SECURE:-true}"
          ENV_VARS="${ENV_VARS},DATABASE_SYNC=${DATABASE_SYNC:-true}"
          if [ -n "${CORS_ORIGIN}" ]; then
            ENV_VARS="${ENV_VARS},CORS_ORIGIN=${CORS_ORIGIN}"
          fi
          if [ -n "${ALLOW_SEED}" ]; then
            ENV_VARS="${ENV_VARS},ALLOW_SEED=${ALLOW_SEED}"
          fi
          echo "env_vars=${ENV_VARS}" >> "$GITHUB_OUTPUT"

          SECRETS="JWT_SECRET=${SM_JWT_SECRET},DATABASE_PASSWORD=${SM_DATABASE_PASSWORD}"
          echo "secrets=${SECRETS}" >> "$GITHUB_OUTPUT"

      - name: Deploy Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          service: ${{ env.SERVICE }}
          image: ${{ env.IMAGE }}
          region: ${{ env.REGION }}
          flags: ${{ steps.flags.outputs.value }}
          env_vars: ${{ steps.flags.outputs.env_vars }}
          secrets: ${{ steps.flags.outputs.secrets }}

  deploy-web:
    name: Deploy Web (Cloud Run)
    needs: build-web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.GCP_CLOUD_RUN_WEB_SERVICE }}
      CONTAINER_ACCOUNT: ${{ vars.GCP_CONTAINER_ACCOUNT }}
      IMAGE: ${{ needs.build-web.outputs.image }}
    steps:
      - name: Skip when web service is unset
        id: gate
        run: |
          if [ -z "${SERVICE}" ]; then
            echo "GCP_CLOUD_RUN_WEB_SERVICE not set — image was pushed; skipping Cloud Run deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate deploy vars
        if: steps.gate.outputs.skip != 'true'
        run: |
          missing=0
          for name in PROJECT_ID REGION SERVICE IMAGE; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty"
              missing=1
            fi
          done
          echo "Deploy target project=${PROJECT_ID} region=${REGION} service=${SERVICE}"
          exit "$missing"

      - uses: google-github-actions/auth@v2
        if: steps.gate.outputs.skip != 'true'
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.gate.outputs.skip != 'true'
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Cloud Run flags
        if: steps.gate.outputs.skip != 'true'
        id: flags
        run: |
          FLAGS="--port=8080 --allow-unauthenticated --cpu-boost"
          if [ -n "${CONTAINER_ACCOUNT}" ]; then
            FLAGS="$FLAGS --service-account=${CONTAINER_ACCOUNT}"
          fi
          echo "value=${FLAGS}" >> "$GITHUB_OUTPUT"

      - name: Deploy Cloud Run
        if: steps.gate.outputs.skip != 'true'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          service: ${{ env.SERVICE }}
          image: ${{ env.IMAGE }}
          region: ${{ env.REGION }}
          flags: ${{ steps.flags.outputs.value }}
